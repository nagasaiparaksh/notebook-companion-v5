<template>
  <style>
    #root { position: absolute; inset: 0; background: #12100D; overflow: hidden; }
    #t-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .t-label { font-family: "Inter", sans-serif; font-weight: 700; font-size: 28px; letter-spacing: 0.14em; fill: #EDE6DA; text-anchor: middle; }
  </style>
  <div id="root" data-composition-id="timeline" data-width="1920" data-height="1080">
    <svg id="t-svg" class="clip" data-start="0" data-duration="4.8" viewBox="0 0 1920 1080" data-layout-allow-overflow>
      <defs><filter id="t-glow" x="-10%" y="-200%" width="120%" height="500%"><feGaussianBlur stdDeviation="10" /></filter></defs>
      <g id="t-cam">
        <g id="t-panels"></g>
      </g>
      <g id="t-wavewrap">
        <path id="t-waveglow" d="M 0 0" fill="none" stroke="#FFE45C" stroke-width="14" stroke-linecap="round" filter="url(#t-glow)" opacity="0" />
        <path id="t-wave" d="M 0 0" fill="none" stroke="#FFE45C" stroke-width="5" stroke-linecap="round" opacity="0" />
      </g>
    </svg>
  </div>
  <script>
    (() => {
      const NS = "http://www.w3.org/2000/svg", $ = (id) => document.getElementById(id);
      const mk = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p && p.appendChild(e); return e; };
      const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), lerp = (a, b, p) => a + (b - a) * p;
      const E = { io: (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2), out: (p) => 1 - Math.pow(1 - p, 4), in3: (p) => p * p * p, lin: (p) => p };
      const seg = (t, a, b, e = "io") => E[e](cl((t - a) / (b - a)));
      const ERAS = ["stone", "leaf", "paper", "print", "type", "touch", "voice"], PW = 224, PH = 126, GAP = 28, X0 = (1920 - (7 * PW + 6 * GAP)) / 2, PY = 410, WY = 700;
      const panels = ERAS.map((n, i) => {
        const x = X0 + i * (PW + GAP), g = mk("g", {}, $("t-panels"));
        const img = mk("image", { href: `assets/img/eras/${n}.png`, x, y: PY, width: PW, height: PH, preserveAspectRatio: "xMidYMid slice" }, g);
        const frame = mk("rect", { x, y: PY, width: PW, height: PH, rx: 4, fill: "none", stroke: "#EDE6DA", "stroke-opacity": 0.35, "stroke-width": 1.5 }, g);
        const label = mk("text", { x: x + PW / 2, y: PY + PH + 48, class: "t-label" }, g); label.textContent = n.toUpperCase();
        if (i < 6) mk("path", { d: `M ${x + PW + 9} ${PY + PH / 2 - 9} l 9 9 l -9 9`, fill: "none", stroke: "#EDE6DA", "stroke-opacity": 0.4, "stroke-width": 3, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
        return { g, img, label, x };
      });
      const VX = X0 + 6 * (PW + GAP) + PW / 2, VY = PY + PH / 2, ZOOM = 1920 / PW;
      function wave(x0, x1, y, amp, t) {
        let d = "";
        for (let i = 0; i <= 200; i++) { const u = i / 200, x = lerp(x0, x1, u), env = Math.pow(Math.sin(Math.PI * u), 0.6); d += (i ? " L " : "M ") + x.toFixed(1) + " " + (y + amp * env * Math.sin(u * 40 + t * 7) * (0.6 + 0.4 * Math.sin(u * 11 + t * 3))).toFixed(1); }
        return d;
      }
      function render(t) {
        // the camera pulls back from the last frame of the story (the VOICE panel) to the whole timeline
        const z = seg(t, 0.05, 1.45, "io"), s = Math.exp(lerp(Math.log(ZOOM), 0, z)), cx = lerp(VX, 960, z), cy = lerp(VY, 470, z);
        $("t-cam").setAttribute("transform", `translate(960 540) scale(${s}) translate(${-cx} ${-cy})`);
        // the voice waveform travels across every era, getting brighter
        const head = seg(t, 1.5, 3.5, "io"), x0 = X0, x1 = lerp(X0, 1920 - X0, head), bright = 0.45 + 0.55 * head;
        const fade = seg(t, 3.9, 4.4, "in3"), toCenter = seg(t, 4.0, 4.75, "io");
        const wy = lerp(WY, 540, toCenter), wx0 = lerp(x0, -40, toCenter), wx1 = lerp(x1, 1960, toCenter);

        $("t-wave").setAttribute("opacity", t > 1.45 ? 1 : 0); $("t-waveglow").setAttribute("opacity", t > 1.45 ? 0.25 + 0.5 * bright : 0);
        panels.forEach((p, i) => {
          const lit = cl((x1 - p.x) / PW), base = z < 1 && i === 6 ? 1 : 0.5;
          p.img.style.filter = `brightness(${lerp(base, 1, i === 6 ? 1 : lit)}) saturate(${lerp(0.6, 1, lit)})`;
          p.label.setAttribute("opacity", (0.4 + 0.6 * lit) * seg(t, 1.0 + i * 0.05, 1.4 + i * 0.05));
          p.g.setAttribute("opacity", 1 - seg(t, 3.9 + (6 - i) * 0.04, 4.3 + (6 - i) * 0.04, "in3"));
          p.g.setAttribute("transform", `translate(0 ${30 * seg(t, 3.9 + (6 - i) * 0.04, 4.3 + (6 - i) * 0.04, "in3")})`);
        });
      }
      const tl = gsap.timeline({ paused: true }), clock = { t: 0 };
      tl.to(clock, { t: 4.8, duration: 4.8, ease: "none", onUpdate: () => render(clock.t) }, 0);
      render(0);
      window.__timelines["timeline"] = tl;
    })();
  </script>
</template>
