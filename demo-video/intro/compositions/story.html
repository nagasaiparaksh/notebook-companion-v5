    (() => {
      const NS = "http://www.w3.org/2000/svg", $ = (id) => document.getElementById(id);
      const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; };
      // ---------- easing + keyframes
      const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), lerp = (a, b, p) => a + (b - a) * p;
      const E = { lin: (p) => p, io: (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2), out: (p) => 1 - Math.pow(1 - p, 4),
                  expo: (p) => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p)), in3: (p) => p * p * p, io2: (p) => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2) };
      const seg = (t, a, b, ease = "io") => E[ease](cl((t - a) / (b - a)));
      // keyframes: [[t, value, ease-into-this-key], ...] ; values numbers or arrays
      function kf(t, keys) {
        if (t <= keys[0][0]) return keys[0][1];
        for (let i = 1; i < keys.length; i++) {
          const [t1, v1, e] = keys[i], [t0, v0] = keys[i - 1];
          if (t <= t1) { const p = E[e || "io"]((t - t0) / (t1 - t0)); return Array.isArray(v0) ? v0.map((x, j) => lerp(x, v1[j], p)) : lerp(v0, v1, p); }
        }
        return keys[keys.length - 1][1];
      }
      const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

      // ---------- static builds (not timed elements)

        const y = 760 + r * 17, f = (y - 744) / 116, x0 = lerp(1000, 948, f) + 18, x1 = lerp(1460, 1512, f) - 18, n = 13, w = (x1 - x0) / n;
        for (let i = 0; i < n; i++) mk("rect", { x: x0 + i * w + 2, y, width: w - 5, height: 12, rx: 3, fill: "#EEF0F4", stroke: "#2B2B2B", "stroke-width": 2 }, keys);
      }
      const list = $("s-list"), CARDS = [["Photosynthesis", "#FFE45C"], ["Calvin cycle", "#C9F2DD"], ["Light reactions", "#FFD0C2"], ["Chloroplasts", "#D9D2FF"], ["Leaf structure", "#BFD4FF"]];

      const cardEls = [];

        const g = mk("g", { transform: `translate(${page * 360} ${-142 + i * 110})` }, list);
        const bg = mk("rect", { x: -146, y: 0, width: 292, height: 94, rx: 14, fill: "#FFFFFF", stroke: "#2B2B2B", "stroke-width": 3 }, g);

        const tx = mk("text", { x: -114, y: 36, class: "ui", "font-size": 22 }, g); tx.textContent = title;
        mk("rect", { x: -114, y: 52, width: 210, height: 10, rx: 5, fill: "#2B2B2B", opacity: 0.22 }, g);
        mk("rect", { x: -114, y: 70, width: 150, height: 10, rx: 5, fill: "#2B2B2B", opacity: 0.22 }, g);
        cardEls.push(bg);
      }));
      const bars = [];
      for (let i = 0; i < 13; i++) bars.push(mk("rect", { x: -126 + i * 20, y: -20, width: 12, height: 20, rx: 6, fill: i % 2 ? "#3B5BDB" : "#FFE45C", stroke: "#2B2B2B", "stroke-width": 2.5 }, $("s-bars")));

      function buildHand(g) {
        const fist = mk("g", {}, g);
        mk("circle", { cx: 0, cy: 0, r: 30, fill: "#C98B60", class: "ink" }, fist);
        mk("path", { d: "M -14 -20 Q 6 -32 22 -14", fill: "none", stroke: "#B07548", "stroke-width": 4, "stroke-linecap": "round" }, fist);
        mk("ellipse", { cx: -18, cy: -14, rx: 13, ry: 10, fill: "#C98B60", class: "ink", "stroke-width": 3 }, fist);
        const flat = mk("g", {}, g);
        mk("path", { d: "M -34 -8 Q -30 -30 0 -30 Q 34 -30 40 -6 Q 42 18 10 22 Q -28 24 -34 -8 Z", fill: "#C98B60", class: "ink" }, flat);
        mk("path", { d: "M 6 -28 L 6 -12 M 20 -26 L 20 -10 M -8 -28 L -8 -12", stroke: "#B07548", "stroke-width": 4, "stroke-linecap": "round" }, flat);
        const point = mk("g", {}, g);
        mk("rect", { x: -9, y: -66, width: 18, height: 52, rx: 9, fill: "#C98B60", class: "ink", transform: "rotate(-28)" }, point);
        mk("circle", { cx: 0, cy: 0, r: 30, fill: "#C98B60", class: "ink" }, point);
        mk("path", { d: "M -16 -18 Q 0 -28 16 -18", fill: "none", stroke: "#B07548", "stroke-width": 4, "stroke-linecap": "round" }, point);
        return { fist, flat, point };
      }
      const HN = buildHand($("s-handN")), HF = buildHand($("s-handF"));
      const waves = [];
      for (let i = 0; i < 6; i++) {
        const g = mk("g", { opacity: 0 }, $("s-waves"));
        mk("path", { d: "M 0 -34 Q 26 0 0 34", fill: "none", stroke: "#2B2B2B", "stroke-width": 15, "stroke-linecap": "round" }, g);
        mk("path", { d: "M 0 -34 Q 26 0 0 34", fill: "none", stroke: "#FFE45C", "stroke-width": 8, "stroke-linecap": "round" }, g);
