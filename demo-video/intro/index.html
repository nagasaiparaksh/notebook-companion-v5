<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0E1116; }
      #root { position: relative; width: 1920px; height: 1080px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="25.1" data-width="1920" data-height="1080">
      <!-- writing -> typing -> touch -> voice, one character, one continuous scene (freezes at 19.6 s) -->
      <div id="story" data-composition-id="story" data-composition-src="compositions/story.html" data-start="0" data-duration="20.4"
           data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 1"></div>
      <!-- the question, then the bridge into the real app -->
      <div id="question" data-composition-id="question" data-composition-src="compositions/question.html" data-start="19.9" data-duration="5.2"
           data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 2"></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
